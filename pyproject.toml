[project]
name = "musprepping"
version = "0.1.0"
description = "Forberedelse af medarbejderudviklingssamtaler (MUS) med varm og konkret anerkendelse"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
start = "musprepping.api.main:run"
ingest = "musprepping.ingest.cli:main_entry"
seed = "musprepping.ingest.cli:seed_entry"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
